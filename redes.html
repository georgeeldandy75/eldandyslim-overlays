<!doctype html>

<title>eldandyslim | Overlay deslizante compatible con Streamlabs</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
html,body{width:342px;height:116px;margin:0;padding:0;overflow:hidden;background:transparent!important}
body{font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.stage{position:relative;width:342px;height:116px;overflow:hidden;background:transparent;isolation:isolate}
.pill{position:absolute;top:12px;left:13px;width:316px;height:92px;display:flex;align-items:center;overflow:hidden;
 border:2px solid var(--accent);border-radius:23px;
 background:linear-gradient(170deg,#2a2a31 0%,#0a0a10 46%,#050508 100%);
 box-shadow:0 0 9px var(--glow),inset 0 1px rgba(255,255,255,.23),0 5px 10px rgba(0,0,0,.22);
 opacity:0;transform:translateX(370px);animation:slideCycle 42s linear infinite;animation-delay:var(--delay);will-change:transform,opacity}
.pill:before{content:"";pointer-events:none;position:absolute;left:9px;right:9px;top:3px;height:33px;border-radius:22px 22px 45px 45px;background:linear-gradient(to bottom,rgba(255,255,255,.10),transparent)}
.logo{width:71px;flex:0 0 71px;display:flex;align-items:center;justify-content:center;height:100%}.logo svg{width:50px;height:50px;display:block;filter:drop-shadow(0 0 2px var(--glow))}
.divider{flex:0 0 2px;width:2px;height:53px;background:linear-gradient(to bottom,transparent,#e9e9ef 20%,#e9e9ef 80%,transparent);margin-right:14px}
.handle{flex:0 0 202px;width:202px;height:44px;display:block;overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.65))}
.handle svg{display:block;width:202px;height:44px;overflow:visible}
/* One 7s slot each: 0.9s entering, 6.1s holding, 0.9s exiting as next card enters.
   At 42 seconds, the six cards repeat seamlessly. SVG text has a constrained width to avoid clipping in Streamlabs CEF. */
@keyframes slideCycle{
  0%{transform:translateX(370px);opacity:0}
  2.142857%{transform:translateX(0);opacity:1}
  16.666667%{transform:translateX(0);opacity:1}
  18.809524%{transform:translateX(-370px);opacity:0}
  18.81%{transform:translateX(-370px);opacity:0}
  18.811%{transform:translateX(370px);opacity:0}
  100%{transform:translateX(370px);opacity:0}
}
</style></head>
