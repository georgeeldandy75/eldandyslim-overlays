<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE · Overlay compacto</title>
<style>
/* AJUSTES EDITABLES: cambia los colores, el tamaño y la velocidad aquí. */
:root {
  --ancho: 184px;
  --alto: 62px;
  --rojo: #ff2948;
  --texto: #ffffff;
  --fondo: rgba(12, 14, 23, .94);
  --velocidad-pulso: 1.65s;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
body { display: flex; align-items: center; justify-content: center; }
.badge {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  width: calc(var(--ancho) - 12px);
  height: calc(var(--alto) - 12px);
  border: 1.5px solid rgba(255, 55, 84, .95);
  border-radius: 15px;
  background: linear-gradient(165deg, rgba(38,42,56,.98) 0%, var(--fondo) 52%, rgba(8,9,17,.96) 100%);
  box-shadow: 0 0 9px rgba(255,36,68,.38), inset 0 1px 0 rgba(255,255,255,.15), 0 2px 6px rgba(0,0,0,.25);
  isolation: isolate;
}
.badge::before {
  content: '';
  position: absolute;
  top: 3px; left: 11px; right: 11px;
  height: 35%;
  border-radius: 12px 12px 35% 35%;
  background: linear-gradient(to bottom, rgba(255,255,255,.11), transparent);
  pointer-events: none;
}
.dot {
  width: 15px; height: 15px;
  flex: 0 0 15px;
  position: relative;
  z-index: 1;
  background: var(--rojo);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--rojo);
  animation: dot-glow var(--velocidad-pulso) ease-in-out infinite;
}
.dot::after {
  content: '';
  position: absolute;
  inset: -5px;
  border: 2px solid rgba(255,41,72,.65);
  border-radius: 50%;
  animation: ripple var(--velocidad-pulso) ease-out infinite;
}
.word {
  position: relative;
  z-index: 1;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 900;
  letter-spacing: 2.2px;
  font-size: 26px;
  line-height: 1;
  color: var(--texto);
  text-shadow: 0 1px 2px rgba(0,0,0,.4);
}
@keyframes dot-glow { 0%,100% { opacity:1; box-shadow:0 0 6px var(--rojo); } 50% { opacity:.58; box-shadow:0 0 15px var(--rojo), 0 0 26px rgba(255,41,72,.55); } }
@keyframes ripple { 0% { transform:scale(.65); opacity:0; } 30% { opacity:.8; } 100% { transform:scale(1.65); opacity:0; } }
@media (prefers-reduced-motion: reduce) { .dot,.dot::after { animation:none; } }
</style>
</head>
<body>
  <div class="badge" aria-label="LIVE, transmisión en vivo"><span class="dot" aria-hidden="true"></span><span class="word">LIVE</span></div>
</body>
</html>
